<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>media-glance.nvim</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="start.js"></script>
  </head>
  <body>
    <header>
      <strong id="workspace">media-glance.nvim</strong
      ><span id="status" role="status">Connecting…</span>
      <button id="theme-toggle" class="theme-toggle" type="button">
        Light mode
      </button>
    </header>
    <div class="layout">
      <nav aria-label="Workspace files"><div id="tree"></div></nav>
      <main id="panel" tabindex="-1">
        <div class="document"><p>Choose a file from the sidebar.</p></div>
      </main>
    </div>
  </body>
</html>
