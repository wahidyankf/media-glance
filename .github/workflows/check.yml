name: Check
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  complete:
    name: complete-${{ matrix.os }}-nvim-${{ matrix.nvim }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            nvim: 0.10.4
          - os: ubuntu-24.04
            nvim: 0.12.5
          - os: macos-15
            nvim: 0.12.5
    env:
      GOTOOLCHAIN: go1.26.8
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.8
      - name: Install native tools
        shell: bash
        env:
          NVIM_VERSION: ${{ matrix.nvim }}
        run: |
          set -euo pipefail
          npm run tools
          if [[ "$RUNNER_OS" == Linux ]]; then
            nvim_asset=nvim-linux-x86_64
            if [[ "$NVIM_VERSION" == 0.10.4 ]]; then
              nvim_sha=95aaa8e89473f5421114f2787c13ae0ec6e11ebbd1a13a1bd6fcf63420f8073f
            else
              nvim_sha=bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875
            fi
            sudo apt-get update
            sudo apt-get install -y shellcheck shfmt
          else
            if [[ "$(uname -m)" == arm64 ]]; then
              nvim_asset=nvim-macos-arm64
              nvim_sha=65fb000099e47ca1b762584c484cc833f40e30851a0ec450d4174e16317c1f9b
            else
              nvim_asset=nvim-macos-x86_64
              nvim_sha=81f4518622cb059b450ee2e498c6a1082a222f6bd89589de5bbcf0c6a68aa3fd
            fi
            brew install shellcheck shfmt
          fi
          curl -fsSL "https://github.com/neovim/neovim/releases/download/v${NVIM_VERSION}/${nvim_asset}.tar.gz" -o .deps/nvim.tar.gz
          printf '%s  %s\n' "$nvim_sha" .deps/nvim.tar.gz | shasum -a 256 -c -
          tar -xzf .deps/nvim.tar.gz -C .deps
          printf '%s\n' "$PWD/.deps/$nvim_asset/bin" >> "$GITHUB_PATH"
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.3
      - name: Dependencies and browser
        run: |
          npm ci
          npm run setup
          npm run browser:install
      - name: Complete gate
        run: npm run check:complete
  release-build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: complete
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.8
      - run: npm ci
      - run: npm run release:build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binaries
          path: dist/*
          if-no-files-found: error
